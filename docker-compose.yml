# Local stack: Long Tail API + Temporal worker in one container, with Postgres,
# NATS, MinIO and a self-hosted Temporal. Set TEMPORAL_ADDRESS, TEMPORAL_NAMESPACE
# and TEMPORAL_API_KEY in .env to use a Temporal Cloud namespace instead.

x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PWD: password
  SQL_PASSWORD: password
  POSTGRES_SEEDS: postgres

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-3600}:3000"
    environment:
      PORT: 3000
      APP_ROLE: ${APP_ROLE:-both}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: longtail
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      LT_ADMIN_USER: ${LT_ADMIN_USER:-superadmin}
      LT_ADMIN_PASSWORD: ${LT_ADMIN_PASSWORD:-l0ngt@1l}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-http://localhost:8243}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: dev_api_secret
      NATS_WS_TARGET: ws://nats:9222
      LT_STORAGE_BACKEND: s3
      LT_S3_ENDPOINT: http://minio:9000
      # Signed links must resolve from the site's container as well as the host.
      LT_S3_PUBLIC_ENDPOINT: ${LT_S3_PUBLIC_ENDPOINT:-http://host.docker.internal:9702}
      LT_S3_FORCE_PATH_STYLE: "true"
      LT_S3_BUCKET: fabrication-assets
      LT_S3_ACCESS_KEY: minioadmin
      LT_S3_SECRET_KEY: minioadmin
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: longtail
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf", "--auth", "dev_api_secret"]
    ports:
      - "4722:4222"
      - "9722:9222"
    volumes:
      - ./docker/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9702:9000"
      - "9703:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment: *temporal-db
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7243:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3600
    ports:
      - "8243:8080"

volumes:
  pgdata:
  miniodata:
